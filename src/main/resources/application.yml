spring:
  application:
    name: wojetpmtool
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  main:
    allow-bean-definition-overriding: true
  app:
    jwtCookieName: wojetpmtool
    jwt:
      jwtSecret: ${JWT_SECRET}
      expirationMs: 86400000
  jackson:
    serialization:
      write-dates-as-timestamps: false
logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql: TRACE

server:
  port: 8080

pmtool:
  system-user-password: ${SYSTEM_USER_PASSWORD}
  client-admin-password: ${CLIENT_ADMIN_PASSWORD}
